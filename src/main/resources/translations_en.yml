# English translations for Hephaestus
# These translations will be loaded with the key prefix "hephaestus."

# Job System
job:
  command:
    help:
      header: "=== Job Commands ==="
      list: "/job list - List all available jobs"
      info: "/job info <job> - Show information about a job"
      select: "/job select <job> - Select a job"
      current: "/job current - Show your current job"
      leave: "/job leave - Leave your current job"
      reload: "/job reload - Reload job configuration"
    list:
      empty: "No jobs are available."
      header: "=== Available Jobs ==="
    info:
      not_found: "Job '{0}' not found."
      id: "ID: {0}"
      description: "Description: {0}"
      max_level: "Max Level: {0}"
      allowed_items: "Allowed Items: {0}"
      player_count: "Players with this job: {0}"
    select:
      not_found: "Job '{0}' not found."
      success: "You have selected the job: {0}"
      failed: "Failed to select job. Please try again later."
    current:
      none: "You don't have a job selected."
      header: "=== Your Current Job ==="
      job: "Job: {0}"
      level: "Level: {0}"
    leave:
      none: "You don't have a job to leave."
      success: "You have left your job."
      failed: "Failed to leave job. Please try again later."
    reload:
      success: "Jobs reloaded successfully."
      failed: "Failed to reload jobs."

